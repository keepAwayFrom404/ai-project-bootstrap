name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The compiler is a pinned development dependency; consumers use committed JS.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify generated runtime
        run: |
          git diff --exit-code -- scripts
          test -z "$(git ls-files --others --exclude-standard -- scripts)"
